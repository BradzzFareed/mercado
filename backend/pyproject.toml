[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JBradley", email = "caligayahanbradss@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "joblib>=1.6.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
    "xgboost>=3.4.1",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
